<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        /* Estilos para os avisos de carregamento */
        .aviso-carregando { font-family: Arial, sans-serif; text-align: center; padding: 20px; color: #666; }
        .erro-carregamento { color: red; font-weight: bold; padding: 10px; border: 1px solid red; margin: 10px; }
    </style>
</head>
<body>

    <div id="conteudo-unificado">
        <p class="aviso-carregando" id="status">Loading Files...</p>
    </div>

    <script>
        async function carregarEExecutar() {
            const container = document.getElementById('conteudo-unificado');
            const arquivos = ['1.html', '2.html', '3.html', '4.html'];
            let htmlFinal = "";

            try {
                for (let arquivo of arquivos) {
                    const resposta = await fetch(arquivo);
                    if (!resposta.ok) throw new Error(`Error: ${arquivo}`);
                    
                    let texto = await resposta.text();

                    // Limpa as tags estruturais para não quebrar a página principal
                    texto = texto.replace(/<!DOCTYPE html>/gi, '')
                                 .replace(/<html[^>]*>/gi, '')
                                 .replace(/<\/html>/gi, '')
                                 .replace(/<head[^>]*>[\s\S]*<\/head>/gi, '') // Remove heads duplicados
                                 .replace(/<body[^>]*>/gi, '')
                                 .replace(/<\/body>/gi, '');

                    htmlFinal += `<!-- Start - ${arquivo} -->\n${texto}\n<!-- End - ${arquivo} -->\n`;
                }

                // Injeta e executa todo o HTML combinado na página
                container.innerHTML = htmlFinal;

                // Executa scripts que porventura existam nos arquivos carregados
                container.querySelectorAll('script').forEach(script => {
                    const novoScript = document.createElement('script');
                    Array.from(script.attributes).forEach(attr => novoScript.setAttribute(attr.name, attr.value));
                    novoScript.appendChild(document.createTextNode(script.innerHTML));
                    script.parentNode.replaceChild(novoScript, script);
                });

            } catch (erro) {
                container.innerHTML = `<div class="erro-carregamento">
                    Error ${erro.message}<br>
                </div>`;
            }
        }

        // Executa a função assim que a página abre
        carregarEExecutar();
    </script>

</body>
</html>
